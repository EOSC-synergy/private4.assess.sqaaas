      github.com/PalomoIFCA/private4 pytest:
        commands:
        - /usr/bin/env sh .sqa/script.cerise_nurturing_whale.sh
        container: qc.uni_cerulean_philosophical_starfish
  QC.Ver:
    repos:
      github.com/PalomoIFCA/private4 get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.gamboge_articulate_albatross.sh
        container: qc.ver_glacier_thankful_lionfish
