config:
  credentials:
  - id: https://github.com/PalomoIFCA/private4
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/private4:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/PalomoIFCA/private4
      repo: https://github.com/PalomoIFCA/private4
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/private4 git:
        commands:
        - /usr/bin/env sh .sqa/script.pumpkin_sincere_pangolin.sh
        container: qc.acc_butterscotch_fearless_cockatoo
  QC.Doc:
    repos:
      github.com/PalomoIFCA/private4 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.dusk_romantic_owl.sh
        container: qc.doc_magenta_dreamy_python
      github.com/PalomoIFCA/private4 git:
        commands:
        - /usr/bin/env sh .sqa/script.violet_empathetic_wombat.sh
        container: qc.doc_tundra_tolerant_catfish
  QC.Lic:
    repos:
      github.com/PalomoIFCA/private4 licensee:
        commands:
        - /usr/bin/env sh .sqa/script.purple_logical_orangutan.sh
        container: qc.lic_isabelline_apprehensive_wolverine
  QC.Sec:
    repos:
      github.com/PalomoIFCA/private4 bandit:
        commands:
        - /usr/bin/env sh .sqa/script.dusk_nurturing_whale.sh
        container: qc.sec_cayenne_gentle_porpoise
  QC.Sty:
    repos:
      github.com/PalomoIFCA/private4 flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cadet_lucky_sphinx.sh
        container: qc.sty_emerald_analytical_porpoise
  QC.Uni:
    repos:
      github.com/PalomoIFCA/private4 pytest:
        commands:
        - /usr/bin/env sh .sqa/script.dusk_mindful_giraffe.sh
        container: qc.uni_mahogany_generous_chimpanzee
  QC.Ver:
    repos:
      github.com/PalomoIFCA/private4 get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.sapphire_bubbly_seal.sh
        container: qc.ver_peony_exuberant_moth
timeout: 5400
