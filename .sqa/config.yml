        - /usr/bin/env sh .sqa/script.storm_grateful_beaver.sh
        container: qc.doc_purple_forgiving_falcon
      github.com/PalomoIFCA/private4 git:
        commands:
        - /usr/bin/env sh .sqa/script.mist_inventive_warthog.sh
        container: qc.doc_mahogany_innocent_spren
