config:
  credentials:
  - id: https://github.com/PalomoIFCA/private4
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/private4:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/PalomoIFCA/private4
      repo: https://github.com/PalomoIFCA/private4
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/private4 git:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_worried_kangaroo.sh
        container: qc.acc_fandango_melancholy_platypus
  QC.Doc:
    repos:
      github.com/PalomoIFCA/private4 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.mango_grateful_dragon.sh
        container: qc.doc_vermilion_independent_ferret
      github.com/PalomoIFCA/private4 git:
        commands:
        - /usr/bin/env sh .sqa/script.steel_bubbly_sloth.sh
        container: qc.doc_reef_tactful_capybara
  QC.Lic:
    repos:
      github.com/PalomoIFCA/private4 licensee:
        commands:
        - /usr/bin/env sh .sqa/script.magenta_determined_kirin.sh
        container: qc.lic_butterscotch_eager_wolverine
  QC.Sec:
    repos:
      github.com/PalomoIFCA/private4 bandit:
        commands:
        - /usr/bin/env sh .sqa/script.powder_vibrant_catfish.sh
        container: qc.sec_pine_mature_warthog
  QC.Sty:
    repos:
      github.com/PalomoIFCA/private4 flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cayenne_imaginative_tapir.sh
        container: qc.sty_azure_grumpy_squirrel
  QC.Uni:
    repos:
      github.com/PalomoIFCA/private4 pytest:
        commands:
        - /usr/bin/env sh .sqa/script.orchid_mischievous_stingray.sh
        container: qc.uni_celadon_meticulous_kookaburra
  QC.Ver:
    repos:
      github.com/PalomoIFCA/private4 get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.porcelain_flexible_cockatoo.sh
        container: qc.ver_persimmon_brave_frog
timeout: 5400
